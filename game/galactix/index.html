<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galactix Space Shooter</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #04060e;
            --card-bg: rgba(15, 23, 42, 0.7);
            --border-color: rgba(0, 242, 254, 0.2);
            --color-player: #00f2fe;
            --color-laser: #00f2fe;
            --color-enemy: #ff0055;
            --color-gold: #ffbd03;
            --text-main: #f8fafc;
            --text-muted: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            overflow: hidden;
            background-image: radial-gradient(circle at 50% 50%, rgba(0, 242, 254, 0.08) 0%, transparent 70%);
        }

        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.8rem;
            width: 100%;
            max-width: 420px;
        }

        /* Scoreboard */
        .scoreboard {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 0.8rem 1.2rem;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
        }

        .score-box {
            display: flex;
            flex-direction: column;
        }

        .score-label {
            font-size: 0.65rem;
            color: var(--text-muted);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .score-val {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            font-weight: 800;
            color: #fff;
        }

        .status-badge {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            font-weight: 800;
            color: #00ff88;
            text-shadow: 0 0 8px rgba(0, 255, 136, 0.6);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .status-badge.active {
            opacity: 1;
        }

        /* Arena Canvas */
        .canvas-container {
            position: relative;
            width: 100%;
            aspect-ratio: 3/4;
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: 0 0 40px rgba(0, 242, 254, 0.15);
            background: #000;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Overlay Game Over */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(4, 6, 14, 0.9);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.2rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 10;
        }

        .overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .overlay h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ff0055, #ffbd03);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 0, 85, 0.5);
        }

        .btn-play {
            background: linear-gradient(135deg, var(--color-player), #7928ca);
            color: #000;
            font-weight: 800;
            font-size: 0.95rem;
            padding: 0.8rem 2.2rem;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.5);
            transition: all 0.2s ease;
        }

        .btn-play:hover {
            transform: scale(1.05);
            box-shadow: 0 0 35px rgba(0, 242, 254, 0.8);
        }

        /* Mobile Controls */
        .controls-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            gap: 10px;
            margin-top: 0.2rem;
        }

        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            width: 150px;
        }

        .btn-ctrl {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 10px;
            border-radius: 10px;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }

        .btn-ctrl:active {
            background: rgba(0, 242, 254, 0.2);
        }

        .up { grid-column: 2; }
        .left { grid-column: 1; grid-row: 2; }
        .down { grid-column: 2; grid-row: 2; }
        .right { grid-column: 3; grid-row: 2; }

        .btn-fire {
            flex: 1;
            height: 80px;
            background: linear-gradient(135deg, rgba(255, 0, 85, 0.3), rgba(255, 189, 3, 0.3));
            border: 1px solid rgba(255, 0, 85, 0.5);
            border-radius: 16px;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.2);
            touch-action: manipulation;
        }

        .btn-fire:active {
            background: linear-gradient(135deg, rgba(255, 0, 85, 0.6), rgba(255, 189, 3, 0.6));
        }

        .instructions {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <!-- Dashboard -->
        <div class="scoreboard">
            <div class="score-box">
                <span class="score-label">Skor</span>
                <span class="score-val" id="score">0</span>
            </div>
            
            <div class="status-badge" id="statusBadge">TRIPLE SHOT</div>

            <div class="score-box" style="text-align: right;">
                <span class="score-label">Rekor</span>
                <span class="score-val" id="highScore" style="color: var(--color-gold)">0</span>
            </div>
        </div>

        <!-- Canvas Game Arena -->
        <div class="canvas-container" id="arena">
            <canvas id="gameCanvas" width="360" height="480"></canvas>
            
            <div class="overlay" id="overlay">
                <h1>GALACTIX</h1>
                <p style="color: var(--text-muted); font-size: 0.9rem;" id="finalScoreText">Skor Akhir: 0</p>
                <button class="btn-play" onclick="startGame()">MAIN SEKARANG 🚀</button>
            </div>
        </div>

        <!-- Controls for Mobile -->
        <div class="controls-wrapper">
            <div class="dpad">
                <button class="btn-ctrl up" id="btnUp">▲</button>
                <button class="btn-ctrl left" id="btnLeft">◄</button>
                <button class="btn-ctrl down" id="btnDown">▼</button>
                <button class="btn-ctrl right" id="btnRight">►</button>
            </div>
            <button class="btn-fire" id="btnFire">FIRE 🔥</button>
        </div>

        <div class="instructions">
            Laptop: <b>WASD / Arrow Keys</b> (Gerak) | <b>Spacebar / J</b> (Tembak)
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('highScore');
        const statusBadge = document.getElementById('statusBadge');
        const overlay = document.getElementById('overlay');
        const finalScoreText = document.getElementById('finalScoreText');

        let isRunning = false;
        let score = 0;
        let highScore = localStorage.getItem('galactix_highscore') || 0;
        let gameLoopId;

        highScoreEl.innerText = highScore;

        // Audio Synth Generator (Web Audio API)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(freq, type = 'sine', duration = 0.1) {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        // State Entities
        let player = {};
        let bullets = [];
        let enemies = [];
        let particles = [];
        let powerUps = [];
        let stars = [];
        let keys = {};

        // Power-Up Timer State
        let tripleShotTimer = 0;
        let hasShield = false;

        // Starfield background initialization
        for (let i = 0; i < 50; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2 + 0.5,
                speed: Math.random() * 1.5 + 0.5
            });
        }

        function startGame() {
            player = {
                x: canvas.width / 2 - 15,
                y: canvas.height - 50,
                width: 30,
                height: 30,
                speed: 4.5,
                lastShot: 0
            };
            bullets = [];
            enemies = [];
            particles = [];
            powerUps = [];
            score = 0;
            tripleShotTimer = 0;
            hasShield = false;
            scoreEl.innerText = score;
            statusBadge.classList.remove('active');
            overlay.classList.remove('active');
            isRunning = true;

            cancelAnimationFrame(gameLoopId);
            gameLoop();
        }

        function createExplosion(x, y, color = '#ff0055', count = 12) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    size: Math.random() * 3 + 1,
                    color: color,
                    life: 1
                });
            }
        }

        function spawnEnemy() {
            const rand = Math.random();
            let type = 'standard';
            let width = 24, height = 24, speed = 2, hp = 1, color = '#ff0055';

            if (rand > 0.8) {
                type = 'heavy';
                width = 34; height = 34; speed = 1.2; hp = 3; color = '#ffbd03';
            } else if (rand > 0.6) {
                type = 'fast';
                width = 18; height = 18; speed = 3.5; hp = 1; color = '#9d4edd';
            }

            enemies.push({
                x: Math.random() * (canvas.width - width),
                y: -height,
                width: width,
                height: height,
                speed: speed,
                hp: hp,
                type: type,
                color: color
            });
        }

        function spawnPowerUp(x, y) {
            if (Math.random() > 0.3) return; // 30% drop chance
            const types = ['triple', 'shield', 'bomb'];
            const type = types[Math.floor(Math.random() * types.length)];
            powerUps.push({
                x: x,
                y: y,
                size: 14,
                type: type,
                speed: 1.5
            });
        }

        function shoot() {
            const now = Date.now();
            if (now - player.lastShot < 150) return; // Fire rate limit
            player.lastShot = now;

            playSound(700, 'square', 0.08);

            if (tripleShotTimer > 0) {
                bullets.push({ x: player.x + player.width / 2 - 2, y: player.y, vx: 0, vy: -7 });
                bullets.push({ x: player.x + player.width / 2 - 2, y: player.y, vx: -2, vy: -6.5 });
                bullets.push({ x: player.x + player.width / 2 - 2, y: player.y, vx: 2, vy: -6.5 });
            } else {
                bullets.push({ x: player.x + player.width / 2 - 2, y: player.y, vx: 0, vy: -7 });
            }
        }

        function update() {
            if (!isRunning) return;

            // Player Movement
            if ((keys['ArrowLeft'] || keys['a'] || keys['Left']) && player.x > 0) {
                player.x -= player.speed;
            }
            if ((keys['ArrowRight'] || keys['d'] || keys['Right']) && player.x < canvas.width - player.width) {
                player.x += player.speed;
            }
            if ((keys['ArrowUp'] || keys['w'] || keys['Up']) && player.y > 0) {
                player.y -= player.speed;
            }
            if ((keys['ArrowDown'] || keys['s'] || keys['Down']) && player.y < canvas.height - player.height) {
                player.y += player.speed;
            }
            if (keys['Space'] || keys[' '] || keys['j'] || keys['Fire']) {
                shoot();
            }

            // Power-Up Timer
            if (tripleShotTimer > 0) {
                tripleShotTimer--;
                if (tripleShotTimer === 0) {
                    statusBadge.classList.remove('active');
                }
            }

            // Update Starfield
            stars.forEach(star => {
                star.y += star.speed;
                if (star.y > canvas.height) {
                    star.y = 0;
                    star.x = Math.random() * canvas.width;
                }
            });

            // Update Bullets
            bullets.forEach((b, index) => {
                b.x += b.vx;
                b.y += b.vy;
                if (b.y < 0 || b.x < 0 || b.x > canvas.width) bullets.splice(index, 1);
            });

            // Enemy Spawning
            if (Math.random() < 0.03 + Math.min(score / 5000, 0.05)) {
                spawnEnemy();
            }

            // Update Enemies
            enemies.forEach((enemy, eIndex) => {
                enemy.y += enemy.speed;

                // Player Collision with Enemy
                if (
                    player.x < enemy.x + enemy.width &&
                    player.x + player.width > enemy.x &&
                    player.y < enemy.y + enemy.height &&
                    player.y + player.height > enemy.y
                ) {
                    if (hasShield) {
                        hasShield = false;
                        createExplosion(enemy.x, enemy.y, '#00ff88', 15);
                        enemies.splice(eIndex, 1);
                        playSound(300, 'triangle', 0.2);
                        statusBadge.classList.remove('active');
                    } else {
                        createExplosion(player.x, player.y, '#00f2fe', 25);
                        return gameOver();
                    }
                }

                // Bullet Collision with Enemy
                bullets.forEach((b, bIndex) => {
                    if (
                        b.x < enemy.x + enemy.width &&
                        b.x + 4 > enemy.x &&
                        b.y < enemy.y + enemy.height &&
                        b.y + 10 > enemy.y
                    ) {
                        bullets.splice(bIndex, 1);
                        enemy.hp--;
                        createExplosion(b.x, b.y, '#ffffff', 4);

                        if (enemy.hp <= 0) {
                            createExplosion(enemy.x + enemy.width/2, enemy.y + enemy.height/2, enemy.color, 12);
                            spawnPowerUp(enemy.x + enemy.width/2, enemy.y + enemy.height/2);
                            
                            score += enemy.type === 'heavy' ? 30 : (enemy.type === 'fast' ? 20 : 10);
                            scoreEl.innerText = score;
                            enemies.splice(eIndex, 1);
                            playSound(450, 'square', 0.1);
                        }
                    }
                });

                // Enemy Past Bottom
                if (enemy.y > canvas.height) enemies.splice(eIndex, 1);
            });

            // Update Power-Ups
            powerUps.forEach((p, pIndex) => {
                p.y += p.speed;

                // Player collects power-up
                if (
                    player.x < p.x + p.size &&
                    player.x + player.width > p.x &&
                    player.y < p.y + p.size &&
                    player.y + player.height > p.y
                ) {
                    playSound(900, 'sine', 0.2);
                    if (p.type === 'triple') {
                        tripleShotTimer = 400; // ~6.5 seconds
                        statusBadge.innerText = "TRIPLE SHOT!";
                        statusBadge.style.color = "#00ff88";
                        statusBadge.classList.add('active');
                    } else if (p.type === 'shield') {
                        hasShield = true;
                        statusBadge.innerText = "SHIELD ACTIVE";
                        statusBadge.style.color = "#00f2fe";
                        statusBadge.classList.add('active');
                    } else if (p.type === 'bomb') {
                        enemies.forEach(e => {
                            createExplosion(e.x, e.y, '#ffbd03', 10);
                            score += 10;
                        });
                        enemies = [];
                        scoreEl.innerText = score;
                        playSound(200, 'sawtooth', 0.3);
                    }
                    powerUps.splice(pIndex, 1);
                }

                if (p.y > canvas.height) powerUps.splice(pIndex, 1);
            });

            // Update Particles
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.03;
                if (p.life <= 0) particles.splice(index, 1);
            });
        }

        function draw() {
            // Background Clear
            ctx.fillStyle = '#04060e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Stars
            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                ctx.fillRect(star.x, star.y, star.size, star.size);
            });

            // Draw Player Ship
            ctx.save();
            ctx.shadowColor = '#00f2fe';
            ctx.shadowBlur = 12;
            ctx.fillStyle = '#00f2fe';
            ctx.beginPath();
            ctx.moveTo(player.x + player.width / 2, player.y);
            ctx.lineTo(player.x + player.width, player.y + player.height);
            ctx.lineTo(player.x + player.width / 2, player.y + player.height - 6);
            ctx.lineTo(player.x, player.y + player.height);
            ctx.closePath();
            ctx.fill();

            // Draw Shield Aura if active
            if (hasShield) {
                ctx.strokeStyle = '#00f2fe';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(player.x + player.width / 2, player.y + player.height / 2, 22, 0, Math.PI * 2);
                ctx.stroke();
            }
            ctx.restore();

            // Draw Bullets
            ctx.fillStyle = '#00f2fe';
            ctx.shadowColor = '#00f2fe';
            ctx.shadowBlur = 8;
            bullets.forEach(b => {
                ctx.fillRect(b.x, b.y, 4, 10);
            });
            ctx.shadowBlur = 0;

            // Draw Enemies
            enemies.forEach(enemy => {
                ctx.fillStyle = enemy.color;
                ctx.shadowColor = enemy.color;
                ctx.shadowBlur = 10;

                ctx.beginPath();
                ctx.moveTo(enemy.x + enemy.width / 2, enemy.y + enemy.height);
                ctx.lineTo(enemy.x + enemy.width, enemy.y);
                ctx.lineTo(enemy.x, enemy.y);
                ctx.closePath();
                ctx.fill();
            });
            ctx.shadowBlur = 0;

            // Draw Power-Ups
            powerUps.forEach(p => {
                ctx.fillStyle = p.type === 'triple' ? '#00ff88' : (p.type === 'shield' ? '#00f2fe' : '#ffbd03');
                ctx.shadowColor = ctx.fillStyle;
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size / 2, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.shadowBlur = 0;

            // Draw Particles
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.fillRect(p.x, p.y, p.size, p.size);
            });
            ctx.globalAlpha = 1.0;
        }

        function gameLoop() {
            update();
            draw();
            if (isRunning) gameLoopId = requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            isRunning = false;
            playSound(120, 'sawtooth', 0.4);

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('galactix_highscore', highScore);
                highScoreEl.innerText = highScore;
            }

            finalScoreText.innerText = `Skor Akhir: ${score}`;
            overlay.classList.add('active');
        }

        // Keyboard Controls
        document.addEventListener('keydown', e => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
                e.preventDefault();
            }
            if (!isRunning && (e.key === ' ' || e.key === 'Enter')) {
                startGame();
                return;
            }
            keys[e.key] = true;
        });

        document.addEventListener('keyup', e => {
            keys[e.key] = false;
        });

        // Mobile Controls Handlers
        function bindTouch(elementId, keyName) {
            const btn = document.getElementById(elementId);
            btn.addEventListener('touchstart', e => { e.preventDefault(); keys[keyName] = true; });
            btn.addEventListener('touchend', e => { e.preventDefault(); keys[keyName] = false; });
            btn.addEventListener('mousedown', e => { keys[keyName] = true; });
            btn.addEventListener('mouseup', e => { keys[keyName] = false; });
        }

        bindTouch('btnUp', 'Up');
        bindTouch('btnDown', 'Down');
        bindTouch('btnLeft', 'Left');
        bindTouch('btnRight', 'Right');
        bindTouch('btnFire', 'Fire');

        // Start initial state
        startGame();
    </script>
</body>
</html>
