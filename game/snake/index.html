<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Snake FX</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #060810;
            --card-bg: rgba(15, 23, 42, 0.65);
            --border-color: rgba(255, 255, 255, 0.08);
            --color-snake: #00f2fe;
            --color-food: #ff007a;
            --color-gold: #ffbd03;
            --color-slow: #9d4edd;
            --text-main: #f8fafc;
            --text-muted: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            overflow: hidden;
            background-image: radial-gradient(circle at 50% 50%, rgba(0, 242, 254, 0.05) 0%, transparent 60%);
        }

        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            width: 100%;
            max-width: 400px;
        }

        /* Score & Speed Dashboard */
        .scoreboard {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 0.8rem 1.4rem;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
        }

        .score-box {
            display: flex;
            flex-direction: column;
        }

        .score-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .score-val {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            font-weight: 800;
            color: #fff;
        }

        .combo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .combo-badge {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--color-food), var(--color-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .combo-badge.active {
            opacity: 1;
            animation: bounce 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .speed-level {
            font-size: 0.7rem;
            color: var(--color-snake);
            font-weight: 700;
            margin-top: 2px;
        }

        @keyframes bounce {
            0% { transform: scale(0.5); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        /* Canvas Arena */
        .canvas-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            background: #000;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Overlay Game Over */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(6, 8, 16, 0.88);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .overlay h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            color: var(--color-food);
            text-shadow: 0 0 20px rgba(255, 0, 122, 0.5);
        }

        .btn-play {
            background: linear-gradient(135deg, var(--color-snake), #7928ca);
            color: #000;
            font-weight: 800;
            font-size: 0.95rem;
            padding: 0.8rem 2rem;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
            transition: all 0.2s ease;
        }

        .btn-play:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.7);
        }

        /* Touch Controls for Mobile */
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            width: 180px;
            margin-top: 0.5rem;
        }

        .btn-ctrl {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 12px;
            border-radius: 12px;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-ctrl:active {
            background: rgba(255, 255, 255, 0.2);
        }

        .up { grid-column: 2; }
        .left { grid-column: 1; grid-row: 2; }
        .down { grid-column: 2; grid-row: 2; }
        .right { grid-column: 3; grid-row: 2; }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <!-- Scoreboard -->
        <div class="scoreboard">
            <div class="score-box">
                <span class="score-label">Skor</span>
                <span class="score-val" id="score">0</span>
            </div>
            
            <div class="combo-container">
                <div class="combo-badge" id="comboBadge">2x COMBO!</div>
                <div class="speed-level" id="speedLevel">SPD: LV 1</div>
            </div>

            <div class="score-box" style="text-align: right;">
                <span class="score-label">Rekor</span>
                <span class="score-val" id="highScore" style="color: var(--color-gold)">0</span>
            </div>
        </div>

        <!-- Canvas Game Arena -->
        <div class="canvas-container" id="arena">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            
            <div class="overlay" id="overlay">
                <h2 id="overTitle">GAME OVER</h2>
                <p style="color: var(--text-muted); font-size: 0.9rem;" id="finalScoreText">Skor Akhir: 0</p>
                <button class="btn-play" onclick="startGame()">MAIN LAGI 🔄</button>
            </div>
        </div>

        <!-- Mobile Controls -->
        <div class="controls">
            <button class="btn-ctrl up" onclick="setDir('UP')">▲</button>
            <button class="btn-ctrl left" onclick="setDir('LEFT')">◄</button>
            <button class="btn-ctrl down" onclick="setDir('DOWN')">▼</button>
            <button class="btn-ctrl right" onclick="setDir('RIGHT')">►</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('highScore');
        const comboBadge = document.getElementById('comboBadge');
        const speedLevelEl = document.getElementById('speedLevel');
        const overlay = document.getElementById('overlay');
        const finalScoreText = document.getElementById('finalScoreText');

        const GRID_SIZE = 20;
        const TILE_COUNT = canvas.width / GRID_SIZE;

        // --- PENGATURAN KECEPATAN (DAPAT DISESUAIKAN) ---
        const INITIAL_SPEED = 110;        // Kecepatan awal (ms) - makin kecil makin cepat
        const MIN_SPEED = 40;              // Kecepatan maksimal (ms)
        const SPEED_DECREMENT = 8;        // Pengurangan delay interval saat naik level
        const FOODS_TO_SPEED_UP = 5;       // Ular makin cepat setiap kali makan N buah makanan

        let snake = [];
        let food = {};
        let dx = GRID_SIZE, dy = 0;
        let score = 0;
        let highScore = localStorage.getItem('snake_highscore') || 0;
        let gameInterval;
        let currentSpeed = INITIAL_SPEED;
        let isRunning = false;
        let totalFoodEaten = 0;
        let currentSpeedLevel = 1;

        // Combo & Timer System
        let combo = 0;
        let lastEatTime = 0;

        highScoreEl.innerText = highScore;

        // Sound Effects Generator (Web Audio API)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(freq, type = 'sine', duration = 0.1) {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        function startGame() {
            snake = [
                {x: 160, y: 200},
                {x: 140, y: 200},
                {x: 120, y: 200}
            ];
            dx = GRID_SIZE;
            dy = 0;
            score = 0;
            totalFoodEaten = 0;
            currentSpeedLevel = 1;
            currentSpeed = INITIAL_SPEED;
            combo = 0;
            
            scoreEl.innerText = score;
            speedLevelEl.innerText = `SPD: LV ${currentSpeedLevel}`;
            comboBadge.classList.remove('active');
            overlay.classList.remove('active');
            isRunning = true;
            
            spawnFood();
            resetGameTimer();
        }

        function resetGameTimer() {
            clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, currentSpeed);
        }

        function spawnFood() {
            const rand = Math.random();
            let type = 'normal';
            if (rand > 0.85) type = 'gold';
            else if (rand > 0.70) type = 'slow';

            food = {
                x: Math.floor(Math.random() * TILE_COUNT) * GRID_SIZE,
                y: Math.floor(Math.random() * TILE_COUNT) * GRID_SIZE,
                type: type
            };

            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) spawnFood();
            });
        }

        function gameLoop() {
            update();
            draw();
        }

        function update() {
            if (!isRunning) return;

            let headX = snake[0].x + dx;
            let headY = snake[0].y + dy;

            // ==========================================
            // FITUR 1: WARP WALL (MENEMBUS TEMBOK)
            // ==========================================
            if (headX < 0) headX = canvas.width - GRID_SIZE;
            else if (headX >= canvas.width) headX = 0;

            if (headY < 0) headY = canvas.height - GRID_SIZE;
            else if (headY >= canvas.height) headY = 0;

            const head = { x: headX, y: headY };

            // ==========================================
            // HANYA MATI JIKA MENABRAK TUBUH SENDIRI
            // ==========================================
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) return gameOver();
            }

            snake.unshift(head);

            // Cek Jika Memakan Apel
            if (head.x === food.x && head.y === food.y) {
                const now = Date.now();
                totalFoodEaten++;
                
                // Sistem Combo (Makan < 3 detik)
                if (now - lastEatTime < 3000) {
                    combo++;
                } else {
                    combo = 1;
                }
                lastEatTime = now;

                // Hitung Poin Makanan
                let pts = 10;
                if (food.type === 'gold') pts = 30;
                if (food.type === 'slow') pts = 15;
                
                score += pts * combo;
                scoreEl.innerText = score;

                // ==========================================
                // FITUR 2: ULAR SEMAKIN CEPAT KETIKA SERING MAKAN
                // ==========================================
                if (totalFoodEaten % FOODS_TO_SPEED_UP === 0 && currentSpeed > MIN_SPEED) {
                    currentSpeed = Math.max(MIN_SPEED, currentSpeed - SPEED_DECREMENT);
                    currentSpeedLevel++;
                    speedLevelEl.innerText = `SPD: LV ${currentSpeedLevel}`;
                    resetGameTimer(); // Terapkan kecepatan baru
                    playSound(650, 'triangle', 0.2); // Suara indikator speed up
                }

                // Efek Khusus Apel Ungu (Memperlambat Sementara)
                if (food.type === 'slow' && currentSpeed < INITIAL_SPEED) {
                    currentSpeed = Math.min(INITIAL_SPEED, currentSpeed + 15);
                    resetGameTimer();
                }

                // FX Audio & Visual Combo
                if (combo > 1) {
                    comboBadge.innerText = `${combo}x COMBO!`;
                    comboBadge.classList.add('active');
                    playSound(400 + combo * 100, 'square', 0.15);
                } else {
                    comboBadge.classList.remove('active');
                    playSound(520, 'sine', 0.1);
                }

                spawnFood();
            } else {
                snake.pop();
            }
        }

        function draw() {
            // Background Arena
            ctx.fillStyle = '#060810';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Garis Grid
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.02)';
            for (let i = 0; i < canvas.width; i += GRID_SIZE) {
                ctx.beginPath();
                ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height);
                ctx.moveTo(0, i); ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }

            // Makanan
            if (food.type === 'gold') {
                ctx.fillStyle = '#ffbd03';
                ctx.shadowColor = '#ffbd03';
            } else if (food.type === 'slow') {
                ctx.fillStyle = '#9d4edd';
                ctx.shadowColor = '#9d4edd';
            } else {
                ctx.fillStyle = '#ff007a';
                ctx.shadowColor = '#ff007a';
            }
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(food.x + GRID_SIZE/2, food.y + GRID_SIZE/2, GRID_SIZE/2 - 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Ular Neon
            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? '#00f2fe' : 'rgba(0, 242, 254, ' + (1 - index/snake.length * 0.7) + ')';
                ctx.shadowColor = '#00f2fe';
                ctx.shadowBlur = index === 0 ? 10 : 0;

                ctx.beginPath();
                ctx.roundRect(part.x + 1, part.y + 1, GRID_SIZE - 2, GRID_SIZE - 2, 6);
                ctx.fill();
            });
            ctx.shadowBlur = 0;
        }

        function gameOver() {
            isRunning = false;
            clearInterval(gameInterval);
            playSound(150, 'sawtooth', 0.3);

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snake_highscore', highScore);
                highScoreEl.innerText = highScore;
            }

            finalScoreText.innerText = `Skor Akhir: ${score} | Speed: LV ${currentSpeedLevel}`;
            overlay.classList.add('active');
        }

        // Listener Keyboard
        document.addEventListener('keydown', e => {
            if (!isRunning) return;
            if ((e.key === 'ArrowUp' || e.key === 'w') && dy === 0) { dx = 0; dy = -GRID_SIZE; }
            if ((e.key === 'ArrowDown' || e.key === 's') && dy === 0) { dx = 0; dy = GRID_SIZE; }
            if ((e.key === 'ArrowLeft' || e.key === 'a') && dx === 0) { dx = -GRID_SIZE; dy = 0; }
            if ((e.key === 'ArrowRight' || e.key === 'd') && dx === 0) { dx = GRID_SIZE; dy = 0; }
        });

        // Touch Control Helper
        function setDir(dir) {
            if (!isRunning) return;
            if (dir === 'UP' && dy === 0) { dx = 0; dy = -GRID_SIZE; }
            if (dir === 'DOWN' && dy === 0) { dx = 0; dy = GRID_SIZE; }
            if (dir === 'LEFT' && dx === 0) { dx = -GRID_SIZE; dy = 0; }
            if (dir === 'RIGHT' && dx === 0) { dx = GRID_SIZE; dy = 0; }
        }

        // Jalankan Game saat dibuka
        startGame();
    </script>
</body>
</html>
