<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS ARENA — Next-Gen HTML5 Gaming Hub</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #060913;
            --bg-surface: rgba(15, 23, 42, 0.65);
            --border-glow: rgba(56, 189, 248, 0.2);
            --accent-cyan: #00f2fe;
            --accent-violet: #7928ca;
            --accent-pink: #ff007a;
            --text-primary: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(121, 40, 202, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(0, 242, 254, 0.15) 0%, transparent 40%);
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            pointer-events: none;
            z-index: 0;
        }

        /* Navbar */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            background: rgba(6, 9, 19, 0.75);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .brand-logo {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-violet));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1.2rem;
            color: #000;
        }

        .brand-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            font-size: 1.4rem;
            letter-spacing: 1.5px;
            background: linear-gradient(90deg, #fff, var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            padding: 0.75rem 1.2rem 0.75rem 2.8rem;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            outline: none;
            width: 260px;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
            width: 320px;
        }

        .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            fill: var(--text-muted);
            width: 16px;
            height: 16px;
        }

        /* Main Content */
        main {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            padding: 2.5rem 2rem;
            flex-grow: 1;
        }

        .hero {
            position: relative;
            border-radius: 24px;
            padding: 2.5rem;
            margin-bottom: 2rem;
            background: linear-gradient(135deg, rgba(121, 40, 202, 0.3), rgba(0, 242, 254, 0.15));
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .hero h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .hero p {
            color: var(--text-muted);
        }

        /* Status & Grid */
        .status-message {
            text-align: center;
            padding: 3rem;
            color: var(--accent-cyan);
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.8rem;
        }

        .game-card {
            background: var(--bg-surface);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(10px);
        }

        .game-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: var(--accent-cyan);
            box-shadow: 0 12px 30px rgba(0, 242, 254, 0.2);
        }

        .card-media {
            position: relative;
            width: 100%;
            height: 160px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.3);
        }

        .card-media img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .game-card:hover .card-media img {
            transform: scale(1.1);
        }

        .tag-category {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(6, 9, 19, 0.8);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--accent-cyan);
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
        }

        .card-body {
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .game-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 0.4rem;
            color: #fff;
            text-transform: capitalize;
        }

        .game-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 1.2rem;
            line-height: 1.4;
        }

        .play-trigger {
            width: 100%;
            padding: 0.75rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            font-weight: 700;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
        }

        .game-card:hover .play-trigger {
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-violet));
            color: #000;
            border-color: transparent;
        }

        /* Modal Player */
        .player-modal {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(6, 9, 19, 0.95);
            backdrop-filter: blur(20px);
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .player-modal.active {
            opacity: 1;
            pointer-events: all;
        }

        .player-header {
            padding: 1rem 2rem;
            background: rgba(15, 23, 42, 0.8);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .player-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            color: var(--accent-cyan);
            text-transform: capitalize;
        }

        .player-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .btn-action {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .btn-close {
            background: var(--accent-pink);
            color: #fff;
            border: none;
            font-weight: bold;
        }

        .player-iframe-wrapper {
            flex-grow: 1;
            width: 100%;
            height: 100%;
        }

        .player-iframe-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="brand-logo">N</div>
            <div class="brand-title">NEXUS ARENA</div>
        </div>
        <div class="search-box">
            <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <input type="text" id="searchInput" placeholder="Cari game..." oninput="handleSearch()">
        </div>
    </header>

    <main>
        <section class="hero">
            <h2>GitHub Games Repository</h2>
            <p>Game dimuat secara otomotis langsung dari folder <code>/game</code> repositori GitHub Anda.</p>
        </section>

        <div id="statusMessage" class="status-message">Menghubungkan ke GitHub...</div>
        <div class="game-grid" id="gameGrid"></div>
    </main>

    <!-- Modal Player -->
    <div class="player-modal" id="playerModal">
        <div class="player-header">
            <div class="player-title" id="playerTitle">Judul Game</div>
            <div class="player-actions">
                <button class="btn-action" onclick="toggleFullscreen()">Layar Penuh ⛶</button>
                <button class="btn-action btn-close" onclick="closeGame()">Tutup ✕</button>
            </div>
        </div>
        <div class="player-iframe-wrapper">
            <iframe id="gameIframe" src="" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        // =========================================================
        // UBAH DUA VARIABEL DI BAWAH SESUAI USERNAME & REPO GITHUB ANDA!
        // =========================================================
        const GITHUB_USERNAME = "username-anda";
        const GITHUB_REPO     = "nama-repositori-anda";
        const GITHUB_BRANCH   = "main"; // atau "master"

        let fetchedGames = [];

        // Ambil Daftar Game Otomatis dari GitHub API
        async function fetchGamesFromGitHub() {
            const statusEl = document.getElementById('statusMessage');
            const apiUrl = `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/game?ref=${GITHUB_BRANCH}`;

            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error("Folder /game tidak ditemukan atau repositori bersifat private.");
                
                const files = await response.json();
                
                // Filter hanya item yang berbentuk Folder (directory)
                const gameFolders = files.filter(file => file.type === 'dir');

                if (gameFolders.length === 0) {
                    statusEl.innerText = "Tidak ada folder game di dalam folder /game.";
                    return;
                }

                // Bangun Data Game berdasarkan nama Folder
                fetchedGames = await Promise.all(gameFolders.map(async (folder) => {
                    const gameName = folder.name.replace(/-/g, " "); // Format nama folder jadi judul
                    const baseURL = `https://${GITHUB_USERNAME}.github.io/${GITHUB_REPO}/game/${folder.name}/`;
                    
                    let metaData = {
                        title: gameName,
                        category: "HTML5 Game",
                        desc: "Mainkan game HTML5 langsung dari repositori GitHub.",
                        image: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=600&q=80",
                        url: `${baseURL}index.html`
                    };

                    // Coba baca metadata.json opsional di dalam folder game jika ada
                    try {
                        const metaRes = await fetch(`${baseURL}metadata.json`);
                        if (metaRes.ok) {
                            const customMeta = await metaRes.json();
                            metaData = { ...metaData, ...customMeta };
                            // Jika image berupa path lokal, ubah ke URL lengkap GitHub Pages
                            if (customMeta.image && !customMeta.image.startsWith('http')) {
                                metaData.image = `${baseURL}${customMeta.image}`;
                            }
                        }
                    } catch (e) {
                        // Abaikan jika tidak ada metadata.json
                    }

                    return metaData;
                }));

                statusEl.style.display = 'none';
                renderGames(fetchedGames);

            } catch (error) {
                console.error(error);
                statusEl.innerText = "Gagal memuat game dari GitHub. Pastikan URL Username & Repo sudah benar.";
            }
        }

        // Render Kartu Game ke Grid
        function renderGames(data) {
            const grid = document.getElementById('gameGrid');
            grid.innerHTML = '';

            if(data.length === 0) {
                grid.innerHTML = `<p style="color: var(--text-muted); grid-column: 1/-1; text-align: center;">Game tidak ditemukan...</p>`;
                return;
            }

            data.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.onclick = () => openGame(game.title, game.url);
                card.innerHTML = `
                    <div class="card-media">
                        <span class="tag-category">${game.category}</span>
                        <img src="${game.image}" alt="${game.title}" loading="lazy">
                    </div>
                    <div class="card-body">
                        <div>
                            <div class="game-title">${game.title}</div>
                            <div class="game-desc">${game.desc}</div>
                        </div>
                        <button class="play-trigger">
                            <span>MAINKAN SEKARANG</span>
                            <span>▶</span>
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Fitur Cari
        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = fetchedGames.filter(game => 
                game.title.toLowerCase().includes(query) || 
                game.category.toLowerCase().includes(query)
            );
            renderGames(filtered);
        }

        // Controller Modal Iframe Game
        function openGame(title, url) {
            document.getElementById('playerTitle').innerText = title;
            document.getElementById('gameIframe').src = url;
            document.getElementById('playerModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeGame() {
            document.getElementById('playerModal').classList.remove('active');
            document.getElementById('gameIframe').src = '';
            document.body.style.overflow = 'auto';
        }

        function toggleFullscreen() {
            const iframe = document.getElementById('gameIframe');
            if (iframe.requestFullscreen) iframe.requestFullscreen();
            else if (iframe.webkitRequestFullscreen) iframe.webkitRequestFullscreen();
        }

        // Jalankan saat halaman dibuka
        fetchGamesFromGitHub();
    </script>
</body>
</html>
